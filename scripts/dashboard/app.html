<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayPilot Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <aside class="side">
    <a class="logo" href="/"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 21 3l-5.5 18-3.6-7.2z" fill="currentColor"/></svg>PayPilot</a>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-foot">
      <div id="provider"></div>
      <div class="status"><span class="live" id="live"></span><span id="stamp">Connecting</span></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title"></h1>
      <div class="tools">
        <label>Run <select id="run" aria-label="Choose run"></select></label>
        <button id="theme" class="btn" type="button">Theme</button>
      </div>
    </div>
    <div id="error"></div>
    <div id="view"></div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
